---
# Eval variant of epic-creator.yaml: same prompt, scripts, image, policy, gates
# (the validation loop's DONE gate, pre-script, post-script), but no production
# Jira credential or Atlassian egress and with the models under evaluation
# injected from outside.
# fullsend composes this file over its base (internal/harness/compose.go):
# non-empty scalars override, env.sandbox / env.runner merge with these keys
# winning, and the child provider and OpenShell profile replace the base entries
# with the same name and id. Provider credentials and profiles are gateway state
# keyed by name and id. Run evals on a separate OpenShell gateway from production
# so their `jira` entries cannot overwrite each other.
#
# `model` is not set: `fullsend run --model` passes the model under evaluation.
# tests/test_fullsend_eval_harness.py pins this file to the keys below.
#
# fullsend resolves `base` relative to this file's directory, unlike the
# fullsend-dir-relative paths below (epic-creator/epic-creator.yaml would look for
# .fullsend/epic-creator/epic-creator/epic-creator.yaml).
base: epic-creator.yaml
# The production prompt under this harness's name. fullsend's Claude runtime
# refuses a prompt whose frontmatter name is not the harness name, and
# prompt.md declares `epic-creator`; prompt-eval.md differs from it only in the
# frontmatter. A test keeps the two bodies identical.
agent: epic-creator/prompt-eval.md

# One iteration plus sandbox startup, the pre-script, a result-file retry and
# the post-script fit the eval's 14400 s execution.timeout. Two full iterations
# intentionally do not fit; the retry exists for a finished pipeline whose
# result file failed validation, not for resuming a timed-out pipeline.
timeout_minutes: 125

env:
  sandbox:
    # Literals: the base reads ${JIRA_SERVER}/${JIRA_USER}, which would
    # otherwise be required on the host.
    JIRA_SERVER: "https://redhat.atlassian.net"
    JIRA_USER: "eval"
    # Exported by the eval runner; the base pins a literal.
    CLAUDE_CODE_SUBAGENT_MODEL: "${AGENT_EVAL_SUBAGENT_MODEL}"
  runner:
    # Literals, so a host without Jira credentials passes env validation.
    JIRA_SERVER: "https://redhat.atlassian.net"
    JIRA_USER: "eval"
    JIRA_TOKEN: "eval-no-jira"
    # The inherited pre-script runs on the host before env.sandbox is applied.
    EPIC_SKIP_BOOTSTRAP: "1"
    EPIC_SKIP_COMPONENT_FETCH: "1"

openshell:
  profiles:
    # Replaces the production Jira profile (id: jira): no Atlassian egress.
    - epic-creator/jira-profile-eval.yaml
providers:
  # Replaces the production provider (name: jira) with a literal credential.
  - epic-creator/jira-provider-eval.yaml
