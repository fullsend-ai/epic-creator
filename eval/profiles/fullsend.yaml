extends: ../epic-decompose.yaml

# Fullsend profile for AISDLC-430. The base remains the Claude Code baseline;
# this overlay changes only the execution runtime and removes the Claude Code
# tool interceptor, which the Fullsend runner rejects because its sandbox never
# receives the harness interception hooks.
runner:
  type: fullsend
  agent: epic-creator-eval
  # fullsend resolves its forge from --forge, then config.yaml, then the CI
  # environment (GITHUB_ACTIONS, then GITLAB_CI). The eval never contacts a
  # forge, but under GitLab CI the auto-detection picks gitlab and fullsend
  # then fails with "GitLab role is not registered" for this GitHub-hosted
  # package. Say github explicitly; the managed .fullsend/config.yaml cannot
  # carry a forge: key.
  extra_args: ["--forge", "github"]

execution:
  env:
    JIRA_USER: ""
    JIRA_TOKEN: ""

# No EPIC_SKIP_* variables here. The eval child sets them in env.runner because
# Epic Creator's host-side pre-script must preserve the pre-provisioned eval
# fixtures instead of contacting Jira with placeholder credentials.

inputs:
  tools: !replace []
